[project]
name = "reporevive-ai-service"
version = "0.1.0"
description = "FastAPI AI service for RepoRevive idea refinement, NLP matching, and multi-agent viability analysis"
authors = [{ name = "RepoRevive Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "scikit-learn>=1.5.0",
    "nltk>=3.8.1",
    "httpx>=0.27.0",
    "joblib>=1.4.2",
    "tenacity>=8.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
